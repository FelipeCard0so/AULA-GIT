<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveTest - Felipe Cardoso</title>

    <style>
        /* =====================================================
            RESET & ESTRUTURA GLOBAL
        ===================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            color: rgba(255, 255, 255, 0.94);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: #0b0f19;
        }

        /* =====================================================
            EFEITO GLITCH DE FUNDO
        ===================================================== */
        .glitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url('bg.jpeg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        .glitch::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('bg.jpeg') no-repeat center center;
            background-size: cover;
            opacity: 0.4;
            mix-blend-mode: hard-light;
            animation: glitch2 10s linear infinite;
        }

        .glitch:hover::before {
            animation: glitch1 1s linear infinite;
        }

        /* Camada leve de escurecimento geral do fundo para contraste */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2;
            pointer-events: none;
        }

        /* =====================================================
            ANIMAÇÕES DE GLITCH (@keyframes)
        ===================================================== */
        @keyframes glitch1 {
            0% {
                background-position: 0 0;
                filter: hue-rotate(0deg);
            }
            10% {
                background-position: 5px 0;
            }
            20% {
                background-position: -5px 0;
            }
            30% {
                background-position: 15px 0;
            }
            40% {
                background-position: -5px 0;
            }
            50% {
                background-position: -25px 0;
            }
            60% {
                background-position: -50px 0;
            }
            70% {
                background-position: 0 -20px;
            }
            80% {
                background-position: -60px -20px;
            }
            81% {
                background-position: 0 0;
            }
            100% {
                background-position: 0 0;
                filter: hue-rotate(360deg);
            }
        }

        @keyframes glitch2 {
            0% {
                background-position: 0 0;
                filter: hue-rotate(0deg);
            }
            10% {
                background-position: 5px 0;
            }
            15% {
                background-position: -5px 0;
            }
            20% {
                filter: hue-rotate(360deg);
            }
            25% {
                background-position: 0 0;
                filter: hue-rotate(0deg);
            }
            100% {
                background-position: 0 0;
                filter: hue-rotate(0deg);
            }
        }

        /* =====================================================
            CONTEÚDO (Sem cartão/caixa) 
        ===================================================== */
        .container {
            position: relative;
            z-index: 5;
            text-align: center;
            padding: 20px;
            max-width: 1000px;
            animation: entrada 1.8s ease-out forwards;
        }

        @keyframes entrada {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =====================================================
            STATUS, NOME E DATAS
        ===================================================== */
        .status {
            font-size: clamp(1.5rem, 3vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.045em;
            line-height: 1.05;

            /* Deixa o miolo do texto transparente */
            color: transparent;

            /* Cria a bordinha ao redor do texto (espessura e cor) */
            -webkit-text-stroke: 0.5px rgba(255, 255, 255, 0.2);

            /* Opcional: mantém a sombra para dar profundidade no fundo */
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.2);
        }

        .nome {
            margin-top: 30px;
            font-size: clamp(0.82rem, 1.3vw, 1.05rem);
            font-weight: 400;
            letter-spacing: 0.20em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.84);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .linha {
            width: 45px;
            height: 1px;
            margin: 27px auto 0;
            background: rgba(255, 255, 255, 0.40);
            box-shadow: 0 0 14px rgba(255, 255, 255, 0.30);
        }

        .datetime {
            margin-top: 12px;
            font-size: clamp(0.72rem, 1vw, 0.9rem);
            font-weight: 800;
            letter-spacing: 0.09em;
            color: rgba(255, 255, 255, 0.75);
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        .afastamento {
            margin-top: 20px;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.90);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* =====================================================
            RESPONSIVIDADE MOBILE
        ===================================================== */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }
            .status {
                letter-spacing: -0.025em;
            }
            .nome {
                margin-top: 22px;
                letter-spacing: 0.13em;
            }
            .datetime {
                letter-spacing: 0.045em;
            }
        }
    </style>
</head>

<body>

    <!-- Camada do Efeito Glitch com a imagem de fundo -->
    <div class="glitch"></div>
    <div class="overlay"></div>

    <!-- Conteúdo Textual -->
    <main class="container">
        <div class="status">
            <h1> Fora de atividade!</h1>
        </div>

        <div class="nome">
            <h2> Felipe Cardoso </h2>
        </div>

        <div class="linha"></div>

        <div class="datetime" id="datetime">
            Carregando...
        </div>

        <h2 class="afastamento" id="afastamento">
            Estou afastado há: --- dias
        </h2>
    </main>

    <script>
        function atualizarDataHora() {
            const agora = new Date();

            const data = agora.toLocaleDateString(
                "pt-BR",
                {
                    weekday: "long",
                    day: "2-digit",
                    month: "long",
                    year: "numeric"
                }
            );

            const hora = agora.toLocaleTimeString(
                "pt-BR",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

            // Capitaliza o dia da semana
            const dataFormatada = data.charAt(0).toUpperCase() + data.slice(1);

            document.getElementById("datetime").textContent = `${dataFormatada} • ${hora}`;

            // Cálculo dos dias de afastamento a partir de 05/10/2026
            const dataInicial = new Date(2026, 9, 5); // Mês 9 = Outubro (0 a 11 em JS)
            
            const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            const inicio = new Date(dataInicial.getFullYear(), dataInicial.getMonth(), dataInicial.getDate());

            const diferencaTempo = hoje - inicio;
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

            document.getElementById("afastamento").textContent = `Estou afastado há: ${diferencaDias} dias`;
        }

        atualizarDataHora();
        setInterval(atualizarDataHora, 1000);
    </script>

</body>
</html>
