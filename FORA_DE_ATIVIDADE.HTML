<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Status profissional de Felipe Cardoso.">
    <title>DriveTest | Felipe Cardoso</title>

    <style>
        /* =================================================================
           1. RESET DE ESTILOS E VARIÁVEIS GLOBAIS
           ================================================================ */
        * {
            box-sizing: border-box;
            transition: filter 0.2s ease-in-out, box-shadow 0.2s ease-in-out,
                opacity 0.2s ease-in-out, color 0.2s ease-in-out, background 0.2s ease-in-out,
                text-shadow 0.2s ease-in-out;
        }

        *::before,
        *::after {
            transition: filter 0.2s ease-in-out, box-shadow 0.2s ease-in-out,
                opacity 0.2s ease-in-out, color 0.2s ease-in-out, background 0.2s ease-in-out,
                text-shadow 0.2s ease-in-out;
        }

        html, body {
            height: 100%;
            min-height: 100%;
            overflow: hidden;
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            margin: 0;
            padding: 0 16px 24px;
            background: #000;
            --_size: min(min(600px, 50vh), 50vw);
            font-size: calc(var(--_size) * 0.01);
            --base-clr: #b7b5b4;
            --degofrot: 0.8;
        }

        /* =================================================================
           2. SINO ILUMINADO 3D (ESTRUTURA E CAMADAS DE LUZ)
           ================================================================ */
        .bell-container {
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            margin: auto;
            width: 80em;
            height: 80em;
            opacity: 1;
            cursor: pointer;
            z-index: 1;
            transform-origin: 50% -50vh;
            animation: 5s ease-in-out infinite bell;
        }

        .bell-container * {
            position: absolute;
            left: 0; right: 0; top: 0; bottom: 0;
            margin: auto;
        }

        .rope {
            height: 50vh;
            width: 2em;
            translate: 0 -52%;
            background: linear-gradient(90deg, #2d54744d 0%, #000b 30%, transparent 100%),
                repeating-linear-gradient(-70deg, #252525, #888 2%, #3a3a3a 3%);
        }

        .bell-top {
            width: 14%;
            height: 14%;
            border-radius: 50%;
            translate: 0 -28em;
            background: var(--base-clr);
            box-shadow: inset -1em -0.5em 2em 0.5em #fff, inset 1em -1em 2em 3em #000,
                0 -0.1em 0.4em 0.3em #c6eaffa8;
        }

        .bell-base {
            width: 50%;
            height: 50%;
            border-radius: 50%;
            translate: 0 -24%;
            background: var(--base-clr);
            box-shadow: 0 -0.1em 0.4em 0.2em #c6eaffa8;
        }

        .bell-base::before {
            content: "";
            position: absolute;
            width: 100%;
            height: 80%;
            translate: -18em 20em;
            background-image: radial-gradient(circle at -80% -12%, transparent 50em, var(--base-clr) 50em);
        }

        .bell-base::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 80%;
            translate: 18em 20em;
            transform: rotateY(180deg);
            background-image: radial-gradient(circle at -80% -12%, transparent 50.1em, #cacaca 50.3em, var(--base-clr) 50.5em);
        }

        .bell-base:nth-child(2) {
            filter: brightness(3) blur(1em);
            scale: 0.74 0.84;
            translate: 0em -11em;
        }

        /* Sombras e Reflexos */
        .shadow-l1 {
            width: 30em;
            height: 42em;
            border-radius: 50%;
            rotate: 12deg;
            translate: -3em -6em;
            filter: blur(2em);
            background: #797a80;
        }

        .shadow-l2 {
            width: 130%;
            height: 90%;
            filter: blur(5em);
            translate: -6em 9em;
        }

        .shadow-l2::before {
            display: block;
            content: "";
            width: 68%;
            height: 64%;
            border-radius: 50%;
            rotate: -54deg;
            translate: -8em 2em;
            background: #000000;
        }

        .glow {
            width: 100%;
            height: 100%;
            filter: brightness(2) blur(2em);
        }

        .glow::before {
            content: "";
            display: block;
            width: 100%;
            height: 80%;
            translate: 0 6em;
            scale: 0.94 0.94;
            background: #fff3;
            clip-path: polygon(9% 83%, 12% 79%, 15% 74%, 18% 68%, 20% 62%, 22% 56%, 23% 50%, 24% 43%, 25% 38%, 25% 34%, 26% 29%, 26% 26%, 27% 22%, 29% 19%, 30% 15%, 32% 13%, 34% 10%, 37% 7%, 41% 5%, 44% 4%, 47% 3%, 51% 3%, 55% 3%, 58% 5%, 62% 6%, 73% 29%, 72% 25%, 70% 20%, 67% 16%, 63% 12%, 60% 9%, 58% 8%, 55% 7%, 52% 6%, 48% 6%, 44% 8%, 41% 9%, 37% 12%, 36% 14%, 33% 16%, 31% 20%, 30% 23%, 29% 26%, 28% 31%, 27% 36%, 27% 39%, 26% 44%, 26% 48%, 26% 52%, 25% 56%, 23% 61%, 22% 65%, 21% 69%, 19% 72%, 17% 75%, 15% 78%, 13% 81%);
        }

        .glow2 {
            width: 100%;
            height: 100%;
            filter: brightness(1) blur(0.3em);
            opacity: 0.1;
        }

        .glow2::before {
            content: "";
            display: block;
            width: 100%;
            height: 84%;
            translate: -1em 8.4em;
            background: #fff3;
            clip-path: polygon(9.21% 83%, 12.28% 79%, 15.35% 74%, 18.41% 68%, 20.46% 62%, 22.51% 56%, 23.53% 50%, 24.55% 43%, 25.58% 34%, 26.6% 29%, 27.62% 22%, 29.16% 18.5%, 30.95% 15.75%, 32.74% 13%, 34.78% 10%, 37.85% 7%, 41.94% 5%, 45.01% 4%, 48.08% 3%, 52.17% 3%, 56.27% 3%, 64.01% 6.36%, 55.75% 4.5%, 47.83% 4.75%, 42.84% 5.88%, 39.51% 7.88%, 36.45% 10.38%, 33.38% 14.88%, 30.69% 19%, 29.67% 22.5%, 28.8% 26.72%, 28.21% 31.36%, 26.92% 38.44%, 26.57% 43.67%, 25.51% 48.34%, 25% 54.34%, 23.4% 60.69%, 21.23% 65.38%, 18.41% 71.5%, 16.88% 74.75%, 12.28% 80.5%);
        }

        .left-glow {
            --lgc: #5d819666;
            width: 50%;
            height: 50%;
            border-radius: 50%;
            translate: 0 -24%;
            box-shadow: inset 1em 0em 1em 0.2em var(--lgc);
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
        }

        .left-glow2 {
            --lgc2: #5d819666;
            position: absolute;
            width: 49%;
            height: 50%;
            translate: -19em 10.35em;
            background-image: radial-gradient(circle at -80% -12%, transparent 50em, var(--lgc2) 50.3em, transparent 52em);
            clip-path: polygon(0 0, 100% 0, 100% 78%, 0 78%);
        }

        .r-glow {
            --lgc: #fffaf680;
            width: 50%;
            height: 50%;
            border-radius: 50%;
            translate: 0 -24%;
            box-shadow: inset 1em 0em 1em 0.2em var(--lgc);
            clip-path: polygon(0 0, 100% 0, 100% 50%, 0 50%);
            transform: rotateY(180deg);
        }

        .r-glow2 {
            --lgc2: #fffaf680;
            position: absolute;
            width: 49%;
            height: 50%;
            translate: 18.2em 10.35em;
            background-image: radial-gradient(circle at -80% -12%, transparent 50em, var(--lgc2) 50.3em, transparent 52em);
            clip-path: polygon(0 0, 100% 0, 100% 78%, 0 78%);
            transform: rotateY(180deg) rotateZ(-2deg);
        }

        /* Anéis e Corpo do Sino */
        .mid-ring {
            width: 64%;
            height: 10%;
            border-radius: 50%;
            translate: -0.1em 10em;
            box-shadow: inset -0.3em 1.3em 0.4em -1em #fff5,
                -0.2em -1.2em 0.4em -0.4em #505050, -0.1em -1.8em 0.4em -0.4em #fff5,
                0 -2.5em 0.4em -1em #000000;
            mix-blend-mode: hard-light;
            filter: brightness(0.8);
        }

        .mid-ring.small {
            translate: 0.04em -8em;
            scale: 0.8 0.5;
        }

        .mid-ring::before,
        .mid-ring::after {
            content: "";
            position: absolute;
            display: block;
            top: 10%;
            width: 2em;
            height: 2em;
            border-radius: 50%;
            background: #000;
        }

        .mid-ring::before { left: -2%; }
        .mid-ring::after { right: -2%; }

        .bell-buff-t {
            width: 72%;
            height: 12%;
            border-radius: 50%;
            translate: 0 16em;
            background: #fff2;
            filter: blur(1em);
        }

        .bell-buff {
            width: 88%;
            height: 20%;
            border-radius: 50% 50% 50% 50% / 50% 50% 30% 30%;
            translate: 0 20em;
            background: linear-gradient(90deg, black 40%, var(--base-clr) 90%);
            box-shadow: inset 1em 0 2em -1em #5d819666, inset -1em 0 2em -1em #fff;
        }

        .bell-btm {
            width: 88%;
            height: 18%;
            border-radius: 50%;
            translate: 0 23em;
            background: linear-gradient(90deg, black 40%, var(--base-clr) 90%);
        }

        .bell-btm2 {
            width: 74%;
            height: 12%;
            border-radius: 50%;
            translate: 0 24em;
            background: #fffff6;
            box-shadow: 0 0 1em 0.6em #ffe9d4, -0.8em 0.2em 2em 1em #cca37f,
                -5.4em -0.6em 3em -1em #ce6e1abb, 6em -0.6em 3em -1em #ce6e1abb,
                inset 0em 30.3em 0.3em -30em #c7962d, inset 0 -2em 2em -2em #ffe9d4,
                inset 0em -1em 2em 1em #ce6e1a66;
            filter: brightness(1);
        }

        .bell-ring-container {
            width: 74%;
            height: 24%;
            border-radius: 50% 50% 50% 50% / 25% 25% 0% 0%;
            translate: 0 29.2em;
            overflow: hidden;
        }

        .bell-ring {
            width: 12em;
            height: 12em;
            border-radius: 50%;
            translate: 0 -6em;
            background: #fff;
            box-shadow: 0 0.8em 1em -0.3em #f8e1d0, inset 0 -6em 4em -4em #e3b695,
                inset 0 1em 3em 1em #fff4, inset 0 2em 3em 1em #fff,
                inset 0 100em 0 100em #2c2c2c;
        }

        /* Efeitos de Luz e Raios */
        .bell-rays {
            width: 100%;
            height: 140%;
            translate: 0 -4em;
            border-radius: 50%;
            mix-blend-mode: soft-light;
            box-shadow: inset 0 -21em 4em -20em #000;
        }

        .bell-rays::before {
            content: "";
            position: absolute;
            left: -21em;
            top: -77em;
            display: block;
            width: 100em;
            height: 100em;
            border-radius: 100%;
            transform-origin: 50% 50%;
            filter: blur(0.6em);
            background: repeating-conic-gradient(at 50% 50%, #fff2 0%, transparent 0.6%, #fff2 0.8%);
            animation: radiate 1s linear infinite;
        }

        .volumetric {
            width: 98%;
            height: 224%;
            translate: 0 124em;
            opacity: 0.2;
        }

        .volumetric .vl,
        .volumetric .vr {
            width: 100%;
            height: 100%;
            transform-origin: 50% 20em;
        }

        .volumetric .vl {
            rotate: 22deg;
            box-shadow: inset 40em 0 20em -20em #fff1;
        }

        .volumetric .vr {
            rotate: -22deg;
            box-shadow: inset -40em 0 20em -20em #fff1;
        }

        /* ESTADO DESLIGADO DO SINO (OFF) */
        .off .bell-btm2 { filter: brightness(0.02); }
        .off .bell-ring {
            background: #000;
            box-shadow: 0 0.8em 1em -0.3em #f8e1d000, inset 0 -6em 4em -4em #e3b69500,
                inset 0 1em 3em 1em #fff0, inset 0 -2em 3em 1em #fff2,
                inset 0 100em 0 100em #000;
        }
        .off .bell-rays,
        .off .volumetric { opacity: 0; }

        /* Filtro de Granulação de Fundo */
        .grain {
            position: absolute;
            top: 0; bottom: 0;
            left: 0; right: 0;
            margin: auto;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #000, #0000),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 600 600' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='2' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            filter: contrast(100%) brightness(200%) grayscale(1) opacity(0.168);
            mix-blend-mode: screen;
        }

        /* =================================================================
           3. PAINEL DE CONTEÚDO E BOTÃO ESTILIZADO
           ================================================================ */
        .content-panel {
            position: absolute;
            z-index: 11;
            top: calc(50% + clamp(110px, 15vh, 145px));
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            width: 100%;
            padding: 0 16px;
            text-align: center;
        }

        .button {
            position: relative;
            top: 1em;
            z-index: 11;
            width: fit-content;
            max-width: 100%;
            padding: 0.145em 1.1em;
            border-radius: 0.4em;
            font-size: clamp(14px, 3.2vw, 24px);
            font-family: monospace;
            line-height: 1.3;
            white-space: nowrap;
            color: #000;
            background: #000;
            cursor: pointer;
            box-shadow: inset 0 0.04em 0.06em 0 #fff, inset 0 1em 1em 0 #fff5,
                inset 0 0.2em 0.2em 0 #e3b695;
            animation: 5s ease-in-out infinite lumenbtn;
        }

        .button:hover {
            color: #fff;
            text-shadow: 0 -1px 3px #fff;
            transition: all 0.16s ease-in-out;
        }

        .button::before,
        .button::after {
            content: "";
            position: absolute;
            top: 6em; left: 0; right: 0;
            display: block;
            width: 100%;
            height: 54%;
        }

        .button::before {
            z-index: -2;
            scale: 2;
            border-radius: 100%;
            background: #e3b695;
            filter: blur(12px);
            animation: 5s ease-in-out infinite lumen;
        }

        .button::after {
            z-index: -1;
            border-radius: 30%;
            background: #000c;
            filter: blur(0.3em);
        }

        .status-info {
            position: relative;
            top: 2em;
            z-index: 11;
            width: 100%;
            max-width: 720px;
            margin: 0;
            padding: 0 8px;
            color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
            font-size: clamp(15px, 2.4vw, 17px);
            line-height: 1.5;
            text-align: center;
        }

        .status-info h1 {
            margin: 0 0 3px;
            font-size: 1.1em;
            font-weight: 600;
            letter-spacing: .03em;
        }

        .status-info p { margin: 2px 0; }
        #current-date { color: #bdbdbd; font-size: .9em; }
        #away-days { color: #d4a017; font-size: .95em; }
        #away-days strong { color: #f0c860; }

        /* Alternância de Visibilidade do Painel */
        .bell-container.off ~ .content-panel {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .bell-container:not(.off) ~ .content-panel {
            opacity: 1;
            visibility: visible;
        }

        /* =================================================================
           4. KEYFRAMES E MEDIA QUERIES (ANIMAÇÕES E RESPONSIVIDADE)
           ================================================================ */
        @keyframes bell {
            0%, 100% { rotate: calc(1deg * var(--degofrot)); }
            50% { rotate: calc(-1deg * var(--degofrot)); }
        }

        @keyframes radiate {
            0% { rotate: 0deg; }
            100% { rotate: 6deg; }
        }

        @keyframes lumenbtn {
            0%, 100% {
                box-shadow: inset 0 0.04em 0.06em 0 #fff,
                    inset calc(-0.2em * var(--degofrot)) 1em 1em 0 #fff5,
                    inset calc(-0.2em * var(--degofrot)) 0.2em 0.4em 0 #e3b695;
            }
            50% {
                box-shadow: inset 0 0.04em 0.06em 0 #fff,
                    inset calc(0.2em * var(--degofrot)) 1em 1em 0 #fff5,
                    inset calc(0.2em * var(--degofrot)) 0.2em 0.4em 0 #e3b695;
            }
        }

        @keyframes lumen {
            0%, 100% { translate: calc(-0.8em * var(--degofrot)); }
            50% { translate: calc(0.8em * var(--degofrot)); }
        }

        @media (max-width: 600px) {
            .content-panel { top: calc(50% + clamp(95px, 14vh, 125px)); }
            .button { white-space: normal; }
            #current-date { overflow-wrap: anywhere; }
        }

        @media (max-height: 600px) {
            .content-panel { top: calc(50% + 75px); }
        }
    </style>
</head>
<body>

    <!-- Estrutura do Sino Decorativo -->
    <div class="bell-container off" role="button" tabindex="0" aria-label="Mostrar status">
        <div class="rope"></div>
        <div class="bell-top"></div>
        <div class="bell-base"></div>
        <div class="bell-base"></div>
        <div class="shadow-l1"></div>
        <div class="shadow-l2"></div>
        <div class="left-glow"></div>
        <div class="left-glow2"></div>
        <div class="r-glow"></div>
        <div class="r-glow2"></div>
        <div class="mid-ring"></div>
        <div class="mid-ring small"></div>
        <div class="glow"></div>
        <div class="glow2"></div>
        <div class="bell-buff-t"></div>
        <div class="bell-buff"></div>
        <div class="bell-btm"></div>
        <div class="bell-btm2"></div>
        <div class="bell-ring-container">
            <div class="bell-ring"></div>
            <div class="bell-rays"></div>
        </div>
        <div class="volumetric">
            <div class="vl"></div>
            <div class="vr"></div>
        </div>
    </div>

    <!-- Painel de Informações -->
    <section class="content-panel">
        <button class="button" type="button" aria-expanded="false">Fora de Atividade</button>
        <main class="status-info" aria-live="polite">
            <h1>Felipe Cardoso</h1>
            <p id="current-date">Carregando data...</p>
            <p id="away-days">Estou afastado há <strong>0</strong> dias.</p>
        </main>
    </section>

    <!-- Granulação do Fundo -->
    <div class="grain"></div>

    <!-- =================================================================
       5. LÓGICA JAVASCRIPT
       ================================================================ */ -->
    <script>
        // Elementos do DOM
        const bell = document.querySelector('.bell-container');
        const button = document.querySelector('.button');
        const dateElement = document.getElementById('current-date');
        const daysElement = document.querySelector('#away-days strong');

        // Configuração de Data de Afastamento: Ano, Mês (0-11: 9 = Outubro), Dia
        const startDate = new Date(2026, 9, 5);

        // Alternar visualização (Ligar/Desligar iluminação do sino)
        if (bell && button) {
            function toggleStatus() {
                bell.classList.toggle('off');
                button.setAttribute('aria-expanded', String(!bell.classList.contains('off')));
            }

            bell.addEventListener('click', toggleStatus);
            bell.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    toggleStatus();
                }
            });

            button.addEventListener('click', () => {
                bell.classList.add('off');
                button.setAttribute('aria-expanded', 'false');
            });
        }

        // Atualização do Relógio e Contador de Dias
        function updateStatus() {
            const now = new Date();
            
            const dateText = new Intl.DateTimeFormat('pt-BR', {
                weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'
            }).format(now);
            
            const timeText = new Intl.DateTimeFormat('pt-BR', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            }).format(now);

            dateElement.textContent = 
                dateText.charAt(0).toUpperCase() + dateText.slice(1) + ' • ' + timeText;

            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            daysElement.textContent = Math.max(0, Math.floor((today - startDate) / 86400000));
        }

        // Inicialização do relógio em tempo real
        updateStatus();
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
