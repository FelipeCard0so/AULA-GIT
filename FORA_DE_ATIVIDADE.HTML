<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fora de atividade — Felipe Cardoso</title>


    <style>

        /* =====================================================
            RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }


        /* =====================================================
            FUNDO PRINCIPAL
        ===================================================== */

        body {

            font-family:
                "Segoe UI",
                "Helvetica Neue",
                Arial,
                sans-serif;

            color: rgba(255, 255, 255, 0.94);

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(91, 124, 145, 0.42),
                    transparent 38%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(73, 103, 126, 0.38),
                    transparent 40%
                ),

                radial-gradient(
                    circle at 50% 50%,
                    rgba(52, 72, 88, 0.50),
                    transparent 65%
                ),

                linear-gradient(
                    135deg,
                    #101820 0%,
                    #1c2b36 35%,
                    #263b4a 65%,
                    #111a21 100%
                );

            background-size:
                180% 180%,
                190% 190%,
                160% 160%,
                100% 100%;

            animation:
                atmosfera 32s ease-in-out infinite;
        }


        /* =====================================================
            CAMADA DE LUZ
        ===================================================== */

        body::before {

            content: "";

            position: absolute;

            inset: -50%;

            pointer-events: none;

            background:

                radial-gradient(
                    ellipse at 30% 25%,
                    rgba(255, 255, 255, 0.055),
                    transparent 30%
                ),

                radial-gradient(
                    ellipse at 75% 70%,
                    rgba(255, 255, 255, 0.035),
                    transparent 32%
                );

            animation:
                movimentoLuz 26s ease-in-out infinite alternate;

            transform: translate3d(0, 0, 0);

            will-change: transform;
        }


        /* =====================================================
            TEXTURA ULTRA SUTIL
            ===================================================== */

        body::after {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            opacity: 0.035;

            background-image:

                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");

            mix-blend-mode: soft-light;
        }


        /* =====================================================
            ANIMAÇÃO DO FUNDO
        ===================================================== */

        @keyframes atmosfera {

            0% {

                background-position:
                    0% 20%,
                    100% 80%,
                    50% 50%,
                    0% 50%;
            }

            25% {

                background-position:
                    35% 45%,
                    65% 60%,
                    40% 55%,
                    50% 50%;
            }

            50% {

                background-position:
                    70% 70%,
                    30% 30%,
                    60% 45%,
                    100% 50%;
            }

            75% {

                background-position:
                    45% 35%,
                    75% 65%,
                    45% 60%,
                    50% 50%;
            }

            100% {

                background-position:
                    0% 20%,
                    100% 80%,
                    50% 50%,
                    0% 50%;
            }
        }


        /* =====================================================
            MOVIMENTO DA LUZ
        ===================================================== */

        @keyframes movimentoLuz {

            0% {

                transform:
                    translate3d(-3%, -2%, 0)
                    scale(1);
            }

            50% {

                transform:
                    translate3d(2%, 3%, 0)
                    scale(1.03);
            }

            100% {

                transform:
                    translate3d(4%, -2%, 0)
                    scale(1.06);
            }
        }


        /* =====================================================
            CONTEÚDO
        ===================================================== */

        .container {

            position: relative;

            z-index: 5;

            text-align: center;

            padding: 40px;

            max-width: 1000px;

            animation:
                entrada 1.8s ease-out forwards;
        }


        /* =====================================================
            ENTRADA
        ===================================================== */

        @keyframes entrada {

            from {

                opacity: 0;

                transform:
                    translateY(15px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =====================================================
            STATUS
        ===================================================== */

        .status {

            font-size:
                clamp(
                    2.2rem,
                    5vw,
                    5rem
                );

            font-weight: 300;

            letter-spacing:
                -0.045em;

            line-height: 1.05;

            text-shadow:

                0 2px 8px rgba(0, 0, 0, 0.12),

                0 10px 35px rgba(0, 0, 0, 0.16);
        }


        /* =====================================================
            NOME
        ===================================================== */

        .nome {

            margin-top: 30px;

            font-size:
                clamp(
                    0.82rem,
                    1.3vw,
                    1.05rem
                );

            font-weight: 400;

            letter-spacing:
                0.20em;

            text-transform: uppercase;

            color:
                rgba(255, 255, 255, 0.70);
        }


        /* =====================================================
            LINHA
        ===================================================== */

        .linha {

            width: 45px;

            height: 1px;

            margin:
                27px auto 0;

            background:
                rgba(255, 255, 255, 0.30);

            box-shadow:
                0 0 14px
                rgba(255, 255, 255, 0.18);
        }


        /* =====================================================
            DATA / HORA
        ===================================================== */

        .datetime {

            margin-top: 12px;

            font-size:
                clamp(
                    0.72rem,
                    1vw,
                    0.9rem
                );

            font-weight: 300;

            letter-spacing:
                0.09em;

            color:
                rgba(255, 255, 255, 0.54);
        }


        /* =====================================================
            AFASTAMENTO (H2)
        ===================================================== */

        .afastamento {
            margin-top: 20px;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            font-weight: 300;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.80);
        }


        /* =====================================================
            MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .container {

                padding: 25px;
            }


            .status {

                letter-spacing:
                    -0.025em;
            }


            .nome {

                margin-top: 22px;

                letter-spacing:
                    0.13em;
            }


            .datetime {

                letter-spacing:
                    0.045em;
            }
        }


        /* =====================================================
            REDUÇÃO DE MOVIMENTO
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            body,
            body::before {

                animation: none;
            }

            .container {

                animation: none;
            }
        }

    </style>

</head>


<body>


    <main class="container">

        <div class="status">
            Fora de atividade!
        </div>


        <div class="nome">
            Felipe Cardoso
        </div>


        <div class="linha"></div>


        <div
            class="datetime"
            id="datetime"
        >
            Carregando...
        </div>

        <h2 class="afastamento" id="afastamento">
            Estou afastado há: --- dias
        </h2>

    </main>


    <script>

        function atualizarDataHora() {

            const agora = new Date();


            const data =
                agora.toLocaleDateString(
                    "pt-BR",
                    {
                        weekday: "long",
                        day: "2-digit",
                        month: "long",
                        year: "numeric"
                    }
                );


            const hora =
                agora.toLocaleTimeString(
                    "pt-BR",
                    {
                        hour: "2-digit",
                        minute: "2-digit",
                        second: "2-digit"
                    }
                );


            document
                .getElementById("datetime")
                .textContent =
                `${data} • ${hora}`;


            // Cálculo dos dias de afastamento a partir de 05/10/2026
            const dataInicial = new Date(2026, 9, 5); // Mês 9 = Outubro (0 a 11 em JS)
            
            // Zerando as horas para comparar apenas os dias inteiros com precisão
            const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            const inicio = new Date(dataInicial.getFullYear(), dataInicial.getMonth(), dataInicial.getDate());

            const diferencaTempo = hoje - inicio;
            const diferencaDias = Math.floor(diferencaTempo / (1000 * 60 * 60 * 24));

            document
                .getElementById("afastamento")
                .textContent = `Estou afastado há: ${diferencaDias} dias`;
        }


        atualizarDataHora();


        setInterval(
            atualizarDataHora,
            1000
        );

    </script>


</body>

</html>
