<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="Status profissional de Felipe Cardoso.">
    <title>DriveTest | Felipe Cardoso</title>

    <style>
        /* =================================================================v
           1. VARIÁVEIS GLOBAIS E RESET DE ESTILOS
           ================================================================ */
        :root {
            color-scheme: dark;
            --background: #080808;
            --text: #f5f5f5;
            --muted: #ff;
            --line: rgba(255, 255, 255, .3);
        }

        * {
            box-sizing: border-box;
        }

        /* =================================================================
           2. ESTILOS DO CORPO DA PÁGINA (LAYOUT PRINCIPAL)
           ================================================================ */
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* =================================================================
           3. CAMADA DE FUNDO (BACKGROUND COM GRADIENTE E IMAGEM)
           ================================================================ */
        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(
                    rgba(10, 100, 10, .38),
                    rgba(30, 10, 0, .88)
                ),
                url("bg.jpeg") center / cover no-repeat,
                var(--background);
        }

        /* =================================================================
           4. CONTAINER DO CONTEÚDO CENTRAL
           ================================================================ */
        .container {
            position: relative;
            width: max-content;
            max-width: 100%;
            margin-right: auto;
            margin-left: 5%;
            text-align: center;
            animation: appear .9s ease-out both;
        }

        /* =================================================================
           5. EFEITO TIPOGRÁFICO NO TÍTULO ("FORA DE ATIVIDADE")
           ================================================================ */
        .titulo-efeito {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            white-space: nowrap;
            gap: 0 .015em;
            margin: 0;
            font-size: clamp(1.5rem, 3.6vw, 4.5rem);
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: .015em;
            text-shadow: none;
        }

        .titulo-efeito .letra {
            display: inline-block;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, .85);
            transition:
                color .3s ease,
                transform .3s ease,
                -webkit-text-stroke-color .3s ease;
        }

        /* Animação interativa individual por letra ao passar o mouse */
        .titulo-efeito .letra:hover {
            color: #fff;
            -webkit-text-stroke-color: transparent;
            transform: scale(1.2);
        }

        .titulo-efeito .espaco {
            width: .25em;
            flex-shrink: 0;
        }

        /* =================================================================
           6. ELEMENTOS TEXTUAIS SECUNDÁRIOS (NOME, DIVISOR, DATETIME)
           ================================================================ */
        .nome {
            margin: 27px 0 0;
            color: rgba(255, 255, 255, .85);
            font-size: clamp(.78rem, 2vw, .95rem);
            font-weight: 400;
            letter-spacing: .3em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px #000;
        }

        .divider {
            width: 52px;
            height: 1px;
            margin: 30px auto;
            border: 0;
            background: var(--line);
        }

        .datetime {
            color: var(--muted);
            font-size: clamp(.75rem, 2vw, .9rem);
            font-weight: 400;
            letter-spacing: .035em;
            font-variant-numeric: tabular-nums;
        }

        .elapsed {
            margin: 30px 0 0;
            color: rgba(255, 255, 255, .75);
            font-size: clamp(.9rem, 2.5vw, 1.15rem);
            font-weight: 300;
            letter-spacing: .02em;
        }

        .elapsed strong {
            color: var(--text);
            font-size: 1.15em;
            font-weight: 500;
        }

        /* =================================================================
           7. ANIMAÇÕES E RESPONSIVIDADE (MEDIA QUERIES)
           ================================================================ */
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 22px;
            }

            .container {
                width: 100%;
                margin: 0;
            }

            .titulo-efeito {
                font-size: clamp(1.65rem, 7vw, 2.6rem);
            }

            .nome {
                margin-top: 22px;
                letter-spacing: .2em;
            }

            .divider {
                margin: 25px auto;
            }

            .elapsed {
                margin-top: 25px;
            }
        }

        /* Respeita configurações de acessibilidade para reduzir movimento */
        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
            }

            .titulo-efeito .letra {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <!-- Camada de fundo decorativa -->
    <div class="background" aria-hidden="true"></div>

    <!-- Conteúdo principal -->
    <main class="container">
        <!-- Título principal com letras separadas para efeito individual -->
        <h1 class="titulo-efeito" aria-label="Fora de atividade">
            <span class="letra" aria-hidden="true">F</span>
            <span class="letra" aria-hidden="true">O</span>
            <span class="letra" aria-hidden="true">R</span>
            <span class="letra" aria-hidden="true">A</span>

            <span class="espaco" aria-hidden="true"></span>

            <span class="letra" aria-hidden="true">D</span>
            <span class="letra" aria-hidden="true">E</span>

            <span class="espaco" aria-hidden="true"></span>

            <span class="letra" aria-hidden="true">A</span>
            <span class="letra" aria-hidden="true">T</span>
            <span class="letra" aria-hidden="true">I</span>
            <span class="letra" aria-hidden="true">V</span>
            <span class="letra" aria-hidden="true">I</span>
            <span class="letra" aria-hidden="true">D</span>
            <span class="letra" aria-hidden="true">A</span>
            <span class="letra" aria-hidden="true">D</span>
            <span class="letra" aria-hidden="true">E</span>
        </h1>

        <p class="nome">Felipe Cardoso</p>

        <hr class="divider">

        <!-- Relógio e data atualizados dinamicamente via JS -->
        <p class="datetime" id="datetime">
            Carregando data e hora...
        </p>

        <!-- Contador de dias de afastamento -->
        <p class="elapsed" id="afastamento">
            Tempo de afastamento: calculando...
        </p>
    </main>

    <script>
        /* =================================================================
           8. LÓGICA JAVASCRIPT (CRONÔMETRO E RELÓGIO EM TEMPO REAL)
           ================================================================ */

        // Seleção de elementos do DOM
        const elementoData = document.getElementById("datetime");
        const elementoAfastamento = document.getElementById("afastamento");

        // CONFIGURAÇÃO DA DATA INICIAL: Ano, Mês (0-11, onde 9 = Outubro), Dia
        const dataInicial = new Date(2026, 9, 5); 
        const MILISSEGUNDOS_POR_DIA = 86_400_000;

        // Formatadores nativos para o padrão brasileiro (pt-BR)
        const formatadorData = new Intl.DateTimeFormat("pt-BR", {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });

        const formatadorHora = new Intl.DateTimeFormat("pt-BR", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });

        // Função principal executada a cada segundo para atualizar a tela
        function atualizarPagina() {
            const agora = new Date();
            const dataFormatada = formatadorData.format(agora);

            // Atualiza o relógio e data formatados
            elementoData.textContent = 
                `${dataFormatada.charAt(0).toUpperCase()}${dataFormatada.slice(1)} • ${formatadorHora.format(agora)}`;

            // Normaliza as datas para zerar as horas e calcular a diferença exata em dias inteiros
            const hoje = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            const inicio = new Date(dataInicial.getFullYear(), dataInicial.getMonth(), dataInicial.getDate());

            const dias = Math.round((hoje - inicio) / MILISSEGUNDOS_POR_DIA);

            // Validação caso a data atual seja anterior ao início do afastamento
            if (dias < 0) {
                elementoAfastamento.textContent = 
                    `Afastamento previsto para ${formatadorData.format(dataInicial)}`;
                return;
            }

            // Atualiza de forma segura o texto do tempo de afastamento
            elementoAfastamento.replaceChildren(
                document.createTextNode("Estou afastado há "),
                Object.assign(document.createElement("strong"), {
                    textContent: `${dias} ${dias === 1 ? "dia" : "dias"}`
                })
            );
        }

        // Executa imediatamente ao carregar e define o intervalo de repetição (1 segundo)
        atualizarPagina();
        setInterval(atualizarPagina, 1000);
    </script>
</body>
</html>
