
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080808">
    <meta name="description" content="Status profissional de Felipe Cardoso.">
    <title>DriveTest | Felipe Cardoso</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #080808;
            --text: #f5f5f5;
            --muted: #aaa;
            --line: rgba(255, 255, 255, .3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(
                    rgba(0, 0, 0, .78),
                    rgba(0, 0, 0, .88)
                ),
                url("bg.jpeg") center / cover no-repeat,
                var(--background);
        }

        .container {
            width: min(100%, 760px);
            text-align: center;
            animation: appear .9s ease-out both;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 7vw, 5rem);
            font-weight: 300;
            line-height: 1.12;
            letter-spacing: -.055em;
            text-wrap: balance;
            text-shadow: 0 4px 30px rgba(0, 0, 0, .7);
        }

        .nome {
            margin: 27px 0 0;
            color: rgba(255, 255, 255, .85);
            font-size: clamp(.78rem, 2vw, .95rem);
            font-weight: 400;
            letter-spacing: .3em;
            text-transform: uppercase;
            text-shadow: 0 2px 12px #000;
        }

        .divider {
            width: 52px;
            height: 1px;
            margin: 30px auto;
            border: 0;
            background: var(--line);
        }

        .datetime {
            color: var(--muted);
            font-size: clamp(.75rem, 2vw, .9rem);
            font-weight: 400;
            letter-spacing: .035em;
            font-variant-numeric: tabular-nums;
        }

        .elapsed {
            margin: 30px 0 0;
            color: rgba(255, 255, 255, .75);
            font-size: clamp(.9rem, 2.5vw, 1.15rem);
            font-weight: 300;
            letter-spacing: .02em;
        }

        .elapsed strong {
            color: var(--text);
            font-size: 1.15em;
            font-weight: 500;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 22px;
            }

            .nome {
                margin-top: 22px;
                letter-spacing: .2em;
            }

            .divider {
                margin: 25px auto;
            }

            .elapsed {
                margin-top: 25px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .container {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <div class="background" aria-hidden="true"></div>

    <main class="container">
        <h1>Fora de atividade!</h1>

        <p class="nome">Felipe Cardoso</p>

        <hr class="divider">

        <p class="datetime" id="datetime">
            Carregando data e hora...
        </p>

        <p class="elapsed" id="afastamento">
            Tempo de afastamento: calculando...
        </p>
    </main>

    <script>
        const elementoData = document.getElementById("datetime");
        const elementoAfastamento = document.getElementById("afastamento");

        const dataInicial = new Date(2026, 9, 5);
        const MILISSEGUNDOS_POR_DIA = 86_400_000;

        const formatadorData = new Intl.DateTimeFormat("pt-BR", {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });

        const formatadorHora = new Intl.DateTimeFormat("pt-BR", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });

        function atualizarPagina() {
            const agora = new Date();
            const data = formatadorData.format(agora);

            elementoData.textContent =
                `${data.charAt(0).toUpperCase()}${data.slice(1)} • ${formatadorHora.format(agora)}`;

            const hoje = new Date(
                agora.getFullYear(),
                agora.getMonth(),
                agora.getDate()
            );

            const inicio = new Date(
                dataInicial.getFullYear(),
                dataInicial.getMonth(),
                dataInicial.getDate()
            );

            const dias = Math.round(
                (hoje - inicio) / MILISSEGUNDOS_POR_DIA
            );

            if (dias < 0) {
                elementoAfastamento.textContent =
                    `Afastamento previsto para ${formatadorData.format(dataInicial)}`;
                return;
            }

            elementoAfastamento.replaceChildren(
                document.createTextNode("Estou afastado há "),
                Object.assign(document.createElement("strong"), {
                    textContent: `${dias} ${dias === 1 ? "dia" : "dias"}`
                })
            );
        }

        atualizarPagina();
        setInterval(atualizarPagina, 1000);
    </script>
</body>
</html>
